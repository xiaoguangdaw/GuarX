name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_title:
        description: 'App 显示名称'
        required: true
        default: '小光守护'
      app_id:
        description: '包名后缀（留空自动生成，套用唯一包名避免 UID 冲突）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compute app id / title
        id: vars
        run: |
          TITLE="${{ github.event.inputs.app_title }}"
          if [ -z "$TITLE" ]; then TITLE="小光守护"; fi
          if [ -n "${{ github.event.inputs.app_id }}" ]; then
            APPID="${{ github.event.inputs.app_id }}"
          else
            APPID="com.xiaoguang.a$(TZ=Asia/Shanghai date +%y%m%d%H%M)$(openssl rand -hex 3)"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "appid=$APPID" >> $GITHUB_OUTPUT
          echo "Resolved appId=$APPID"
          echo "Resolved title=$TITLE"

      - name: Build debug APK
        run: |
          gradle assembleDebug \
            -PappTitle="${{ steps.vars.outputs.title }}" \
            -PappId="${{ steps.vars.outputs.appid }}" \
            --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -l "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoGuang-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error